<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heads or Tails</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#fff 0%,#faf7ff 100%);display:flex;justify-content:center;align-items:center;color:#171717;overflow:hidden}
.app{width:100%;max-width:430px;min-height:100vh;padding:35px 24px 30px;display:flex;flex-direction:column;align-items:center}
.top-icon{width:54px;height:54px;border-radius:14px;background:#f1f1f4;display:flex;align-items:center;justify-content:center;font-size:27px;margin-bottom:20px}
h1{margin:0;font-size:30px;font-weight:750;letter-spacing:-.8px}
.subtitle{margin:9px 0 35px;color:#737373;font-size:15px;text-align:center}
.coin-area{width:270px;height:270px;display:flex;align-items:center;justify-content:center;perspective:1000px;margin-bottom:42px}
.coin{width:235px;height:235px;border-radius:50%;background:linear-gradient(145deg,#ff4f9a,#e82e83);box-shadow:0 18px 35px rgba(232,46,131,.25),inset 0 2px 5px rgba(255,255,255,.35),inset 0 -5px 10px rgba(150,0,70,.12);display:flex;align-items:center;justify-content:center;position:relative}
.coin::before{content:"";position:absolute;inset:18px;border-radius:50%;border:2px dashed rgba(255,255,255,.65)}
.coin-text{color:white;font-size:25px;font-weight:800;letter-spacing:2px;z-index:2;text-shadow:0 2px 5px rgba(100,0,50,.15)}
.coin.flipping{animation:coinFlip .42s linear infinite}
@keyframes coinFlip{0%{transform:rotateY(0deg)}50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.flip-button{width:100%;max-width:290px;height:58px;border:none;border-radius:15px;background:#171717;color:white;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.14);transition:transform .15s ease,opacity .2s ease}
.flip-button:active{transform:scale(.97)}
.flip-button:disabled{opacity:.45;cursor:default}

/* Secret controls: just below the main button, no visible text */
.secret-controls{
    position:fixed;
    display:flex;
    flex-direction:column;
    gap:0;
    z-index:100;
    opacity:1;
    pointer-events:auto;
}

.secret-zone{
    width:100%;
    flex:none;
    border:0;
    background:transparent;
    border-radius:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.secret-zone:first-child{
    border-bottom:0;
}

.secret-zone:active{
    background:rgba(220,70,80,.06);
}

@media(max-width:480px){
.app{padding-top:28px}
h1{font-size:28px}
.subtitle{margin-bottom:28px}
.coin-area{margin-bottom:35px}
.coin{width:220px;height:220px}
}
</style>
</head>
<body>
<div class="app">
    <div class="top-icon">🪙</div>
    <h1>Heads or Tails</h1>
    <div class="subtitle">Flip a virtual coin with this online and free app.</div>

    <div class="coin-area">
        <div class="coin" id="coin">
            <div class="coin-text" id="coinText">HEADS</div>
        </div>
    </div>

    <button class="flip-button" id="flipButton">Flip the coin!</button>

    <div class="secret-controls" id="secretControls">
        <div class="secret-zone" id="headsZone"></div>
        <div class="secret-zone" id="tailsZone"></div>
    </div>
</div>

<script>
const coin=document.getElementById("coin");
const coinText=document.getElementById("coinText");
const flipButton=document.getElementById("flipButton");
const subtitle=document.querySelector(".subtitle");
const secretControls=document.getElementById("secretControls");
const headsZone=document.getElementById("headsZone");
const tailsZone=document.getElementById("tailsZone");

let flipping=false;
let selectedResult=null;
const FLIP_TIME=2600;

/*
  Touch-zone layout:
  - Above the coin's exact vertical center = HEADS
  - Below the coin's exact vertical center = TAILS
  - Bottom stops 10px before the Flip button
  - Zone is immediately to the right of the coin
*/
function positionSecretZones(){
    const coinRect=coin.getBoundingClientRect();
    const buttonRect=flipButton.getBoundingClientRect();

    const width=Math.min(120, window.innerWidth*0.22);

    let left=coinRect.right+6;

    if(left+width > window.innerWidth-4){
        left=window.innerWidth-width-4;
    }

    const top=subtitle.getBoundingClientRect().bottom+10;
    const divider=coinRect.top+(coinRect.height/2);
    const bottom=Math.max(divider+1,buttonRect.top-10);

    secretControls.style.left=`${left}px`;
    secretControls.style.top=`${top}px`;
    secretControls.style.width=`${width}px`;
    secretControls.style.height=`${bottom-top}px`;

    headsZone.style.height=`${divider-top}px`;
    tailsZone.style.height=`${bottom-divider}px`;
}

window.addEventListener("resize",positionSecretZones);
window.addEventListener("scroll",positionSecretZones);

flipButton.addEventListener("click",()=>{
    if(flipping)return;

    flipping=true;
    selectedResult=null;
    flipButton.disabled=true;

    coinText.textContent="?";
    coin.classList.add("flipping");

    positionSecretZones();

    setTimeout(()=>{
        flipping=false;
        coin.classList.remove("flipping");

        // If no secret choice was made, choose randomly.
        if(!selectedResult){
            selectedResult=Math.random()<0.5 ? "HEADS" : "TAILS";
        }

        revealResult();
    },FLIP_TIME);
});

// Upper zone = HEADS
headsZone.addEventListener("click",()=>{
    if(flipping) selectedResult="HEADS";
});

// Lower zone = TAILS
tailsZone.addEventListener("click",()=>{
    if(flipping) selectedResult="TAILS";
});

function revealResult(){
    coinText.textContent=selectedResult;

    selectedResult=null;
    flipping=false;
    flipButton.disabled=false;
}

positionSecretZones();
</script>
</body>
</html>
